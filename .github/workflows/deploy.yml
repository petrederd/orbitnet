name: Deploy to server

on:
  push:
    branches: [ main ]

# Two quick pushes must not deploy in parallel: queue them instead. Running
# deploys are never cancelled midway.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Override with a repository variable named DEPLOY_PATH; defaults to the
  # historical location.
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Verify vendored js-yaml
        run: |
          expected=$(sha256sum node_modules/js-yaml/dist/js-yaml.min.js | cut -d' ' -f1)
          actual=$(sha256sum site/assets/vendor/js-yaml.min.js | cut -d' ' -f1)
          echo "js-yaml expected: $expected"
          echo "js-yaml vendored: $actual"
          test "$expected" = "$actual"

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          REQUIRE_BROWSER_TESTS: '1'
        run: npm test

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "${DEPLOY_PATH:-/home/user/orbitnet-site}"

            # The previous run may have rewritten cloudflare-ips.conf; discard
            # that local change so `git pull --ff-only` stays clean.
            git checkout -- cloudflare-ips.conf 2>/dev/null || true
            git pull --ff-only origin main

            # Refresh Cloudflare edge ranges after the pull (falls back to the
            # committed file if the network call fails).
            if [ -x ./scripts/update-cloudflare-ips.sh ]; then
              ./scripts/update-cloudflare-ips.sh || echo "warning: could not refresh cloudflare-ips.conf"
            fi

            docker compose up -d --build --force-recreate

            # Start the GeoLite2 updater only when MaxMind credentials are present
            # in the server-side .env (which is gitignored and created manually).
            if [ -s .env ] && grep -qE '^MAXMIND_(ACCOUNT_ID|LICENSE_KEY)=.+' .env; then
              docker compose --profile geoip up -d
              echo "geoip-updater started"
            else
              echo "geoLite2 updater skipped: no MaxMind credentials in .env"
            fi

            # Wait until the site is actually serving before the live check runs.
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8081/; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "site did not become ready in time" >&2
              exit 1
            fi
            echo "site is ready"

            # Remove dangling images left behind by --build.
            docker image prune -f >/dev/null 2>&1 || true

      - name: Verify published site
        run: npm run test:live