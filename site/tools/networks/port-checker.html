<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Port Checker — check whether a port on a host is open or closed">
<meta name="theme-color" content="#16161a">
<title>Port Checker — OrbitNet</title>
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=2">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<header class="wrap topbar">
  <a class="brand" href="../../index.html">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span>orbitnet<span style="font-weight:500">.ru</span></span>
  </a>
  <nav class="nav">
    <a href="../../index.html#tools">Tools</a>
    <a href="../../index.html#about">About</a>
  </nav>
</header>

<main class="wrap tool-page">
  <div class="tool-header">
    <div class="breadcrumb">
      <a href="../../index.html">Home</a> /
      <a href="../../index.html#tools">Tools</a> /
      <span>Port Checker</span>
    </div>
    <h1>Port Checker</h1>
    <p>Check whether a TCP port on a host is open, closed, or filtered.</p>
  </div>

  <div class="tool-panel">
    <h2>Check port</h2>
    <div id="errorMsg"></div>

    <div class="input-group">
      <label for="host">Host</label>
      <input type="text" id="host" placeholder="example.com or 1.2.3.4" value="127.0.0.1">
    </div>

    <div class="input-group">
      <label for="port">Port</label>
      <input type="number" id="port" placeholder="e.g. 443" value="443" min="1" max="65535">
    </div>

    <button class="btn" onclick="check()">Check Port</button>
  </div>

  <div class="tool-panel">
    <h2>Result</h2>
    <div id="results">
      <div style="text-align: center; padding: 40px 20px; color: var(--muted);">Enter a host and port, then click Check Port</div>
    </div>
  </div>
</main>

<footer class="wrap footer">
  <div><strong>OrbitNet</strong><br>Open source. No ads. No tracking. © <span id="year"></span></div>
  <div class="footer-links"><a href="../../index.html#tools">Browse tools</a><a href="../../index.html#about">About</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

function clearError() { document.getElementById('errorMsg').innerHTML = ''; }
function showError(m) { document.getElementById('errorMsg').innerHTML = '<div class="error">' + m + '</div>'; }

function check() {
  clearError();
  const host = document.getElementById('host').value.trim();
  const port = parseInt(document.getElementById('port').value, 10);
  if (!host) { showError('Please enter a host'); return; }
  if (isNaN(port) || port < 1 || port > 65535) { showError('Port must be 1-65535'); return; }

  document.getElementById('results').innerHTML = '<div class="loading">Checking ' + host + ':' + port + '...</div>';

  fetch('/api/port?host=' + encodeURIComponent(host) + '&port=' + port)
    .then(r => r.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      const cls = data.open ? 'success' : 'error';
      const text = data.open ? 'Port is open' : 'Port is closed';
      const sub = data.error ? data.error : (data.open ? 'Connection established' : 'Connection refused or filtered');
      document.getElementById('results').innerHTML =
        '<div class="result-box highlight"><div class="result-label">' + host + ':' + port + '</div>' +
        '<div class="result-value large ' + cls + '">' + text + '</div>' +
        '<div class="result-sub">' + sub + '</div></div>';
    })
    .catch(e => {
      document.getElementById('results').innerHTML = '';
      showError(e.message);
    });
}
</script>
</body>
</html>
