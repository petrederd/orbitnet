<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitNet Home</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            font-size: 48px;
        }

        p {
            color: #aaa;
        }

        .button {
            display: block;
            width: 250px;
            margin: 20px auto;
            padding: 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            transition: 0.3s;
        }

        .button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .minecraft {
            background: #16a34a;
        }

        .minecraft:hover {
            background: #15803d;
        }
    </style>
</head>

<body>

<h1>🌐 OrbitNet</h1>

<p>Домашний сервер и сервисы</p>

<a class="button" href="https://cloud.orbitnet.ru">
    ☁️ Моё облако
</a>

<a class="button minecraft" href="minecraft://mc.orbitnet.ru">
    ⛏️ Minecraft сервер
</a>

<a class="button" href="https://status.orbitnet.ru">
    📊 Статус сервера
</a>

</body>
</html>
