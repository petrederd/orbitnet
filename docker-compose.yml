services:
  orbitnet-site:
    image: nginx:alpine
    container_name: orbitnet-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orbitnet-api
    ports:
      - "127.0.0.1:8081:80"

  orbitnet-api:
    build: ./backend
    container_name: orbitnet-api
    restart: unless-stopped
    environment:
      - PORT=3000
    expose:
      - "3000"