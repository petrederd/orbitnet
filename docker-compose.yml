# Cap Docker json-file logs at 30 MB per container (10 MB x 3).
# Request logs live in Caddy (sanitised), not in container stdout.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  orbitnet-site:
    logging: *default-logging
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: orbitnet-site
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
    mem_limit: 128m
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
    depends_on:
      orbitnet-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"

  orbitnet-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orbitnet-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    tmpfs:
      - /tmp
    depends_on:
      orbitnet-unbound:
        condition: service_started
    environment:
      - PORT=3000
      - GEOIP_DIR=/data/geoip
      # Optional external checker (Cloudflare Worker).
      # Values live in the gitignored server-side .env, never in this file.
      - CHECKER_URL=${CHECKER_URL:-}
      - CHECKER_SECRET=${CHECKER_SECRET:-}
      - CHECKER_TIMEOUT=${CHECKER_TIMEOUT:-20000}
      - EXTERNAL_RATE_MAX=${EXTERNAL_RATE_MAX:-10}
      - EXTERNAL_GLOBAL_MAX=${EXTERNAL_GLOBAL_MAX:-60}
      - EXTERNAL_NXDOMAIN_RATE_MAX=${EXTERNAL_NXDOMAIN_RATE_MAX:-3}
      - EXTERNAL_NXDOMAIN_GLOBAL_MAX=${EXTERNAL_NXDOMAIN_GLOBAL_MAX:-15}
      - REQUEST_BUDGET_MS=${REQUEST_BUDGET_MS:-22000}
      # DNSBL lookups use the bundled Unbound by default. Override with a
      # private resolver address in .env if you already run one.
      - DNSBL_RESOLVER=${DNSBL_RESOLVER:-orbitnet-unbound:53}
      - DNSBL_MAX_CONCURRENT=${DNSBL_MAX_CONCURRENT:-48}
      - DNSBL_MAX_QUEUE=${DNSBL_MAX_QUEUE:-200}
      - TLS_DEEP_GLOBAL_MAX=${TLS_DEEP_GLOBAL_MAX:-2}
      # Per-client concurrency and per-target check quotas keep one client or
      # one slow target from occupying the shared outbound pool.
      - CLIENT_CONCURRENT_MAX=${CLIENT_CONCURRENT_MAX:-8}
      - TARGET_RATE_MAX=${TARGET_RATE_MAX:-30}
      - TARGET_GLOBAL_RATE_MAX=${TARGET_GLOBAL_RATE_MAX:-300}
      # WHOIS is cached and kept under a small registry-friendly global budget.
      - WHOIS_CACHE_TTL_MS=${WHOIS_CACHE_TTL_MS:-600000}
      - WHOIS_CACHE_MAX=${WHOIS_CACHE_MAX:-1000}
      - WHOIS_GLOBAL_MAX=${WHOIS_GLOBAL_MAX:-30}
      - WHOIS_CLIENT_MAX=${WHOIS_CLIENT_MAX:-5}
      - WHOIS_MAX_CONCURRENT=${WHOIS_MAX_CONCURRENT:-2}
      - WHOIS_MAX_QUEUE=${WHOIS_MAX_QUEUE:-20}
    volumes:
      - ./data/geoip:/data/geoip:ro
    expose:
      - "3000"

  # Private recursive resolver for DNSBL queries. Public resolvers are refused
  # by Spamhaus/SURBL, so the API talks to Unbound over the Compose network.
  orbitnet-unbound:
    logging: *default-logging
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    container_name: orbitnet-unbound
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
      - MKNOD
      - SYS_CHROOT
    mem_limit: 128m
    pids_limit: 128
    tmpfs:
      - /opt/unbound/etc/unbound/dev
      - /opt/unbound/etc/unbound/var
      - /tmp
    volumes:
      - ./deploy/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    expose:
      - "53"
    healthcheck:
      test: ["CMD-SHELL", "drill -Q example.com @127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Keeps the GeoLite2 databases current. MaxMind requires updating the
  # GeoLite2 databases at least every 30 days; this service refreshes them
  # every 24h and the API picks up new files automatically.
  #
  # It is opt-in (profile "geoip") so a plain `docker compose up -d` never
  # fails on missing credentials. To enable it:
  #   1. copy .env.example to .env and fill in your MaxMind credentials
  #   2. docker compose --profile geoip up -d
  geoip-updater:
    logging: *default-logging
    image: ghcr.io/maxmind/geoipupdate@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    container_name: orbitnet-geoip
    restart: unless-stopped
    profiles: ["geoip"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp
    environment:
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-ASN GeoLite2-City
      - GEOIPUPDATE_FREQUENCY=24
      - GEOIPUPDATE_DB_DIR=/data/geoip
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
    volumes:
      - ./data/geoip:/data/geoip
