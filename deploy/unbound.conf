# Recursive resolver for OrbitNet DNSBL lookups.
#
# This deliberately has no forward-zone: the image's default configuration
# forwards to Cloudflare over TLS, which Spamhaus/SURBL treat as a public
# resolver. Unbound uses its built-in root hints and recurses from the roots.
server:
    directory: "/opt/unbound/etc/unbound"
    interface: 0.0.0.0
    port: 53
    username: "_unbound"

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    # Only private Docker address space may use this resolver. The public side
    # never gets a published port, but keep the ACL closed as well. The three
    # RFC 1918 ranges cover Docker address pools; loopback is allowed for the
    # container healthcheck.
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # Do not extend DNSBL TTLs in the resolver; the API applies its own cache
    # policy (10 minutes for clean/listed, 45 seconds for refusals).
    cache-min-ttl: 0
    cache-max-ttl: 3600

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    harden-short-bufsize: yes
    qname-minimisation: yes
    minimal-responses: yes
    rrset-roundrobin: yes
    prefetch: no

    # DNSSEC validation. The image provides the trust anchor under var/.
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
