server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trust the upstream reverse proxy (Caddy) and derive the real client IP
    # from X-Forwarded-For, ignoring any client-supplied entries.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Basic security headers (applied to static responses and proxied ones)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://orbitnet-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 25s;
    }
}
