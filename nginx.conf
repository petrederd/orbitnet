server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Derive the real client IP behind the CDN and reverse proxy.
    # Traffic path: Cloudflare (CDN) -> Caddy on the host -> this nginx.
    #
    # Cloudflare passes the visitor IP in CF-Connecting-IP. Caddy forwards it
    # unchanged, so this nginx reads CF-Connecting-IP and only honours it when
    # the request arrives from a trusted address (the local Caddy, or a
    # Cloudflare edge).
    #
    # SECURITY: because the local Caddy is trusted here, a client that reaches
    # Caddy directly (bypassing Cloudflare) can set CF-Connecting-IP and spoof
    # its address, bypassing rate limiting and the "own IP only" rule. The real
    # fix lives outside this repo: firewall the origin so only Cloudflare edge
    # IPs can connect (or use Cloudflare authenticated origin pulls), and/or
    # configure trusted_proxies + client_ip_headers in Caddy. See README.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Cloudflare edge ranges (auto-refreshed by the deploy workflow).
    include /etc/nginx/cloudflare-ips.conf;

    real_ip_header CF-Connecting-IP;

    # Access logs are deliberately disabled. Caddy already keeps a sanitised
    # 7-day request log (path, status and timing only; no IP, headers or query
    # string), and nginx is reachable only through Caddy. A second access log
    # would duplicate data and add visitor IP addresses without a clear need.
    access_log off;
    # Keep error diagnostics, but avoid notice-level noise in Docker logs.
    error_log /var/log/nginx/error.log warn;

    # Basic security headers (applied to static responses and proxied ones)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # No includeSubDomains: not every subdomain is guaranteed to have HTTPS, and
    # a stricter value could lock them out. Cloudflare/Caddy may also add HSTS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Inline scripts and onclick handlers prevent a stricter policy for now.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    error_page 404 /404.html;
    # Directories without an index would otherwise answer 403, which also leaks
    # the existence of the folder. Report them as not found instead.
    error_page 403 =404 /404.html;

    location = /404.html {
        internal;
    }

    # The tool template is not a public page.
    location = /tools/_template.html {
        return 404;
    }

    # Static files. Directories resolve to their index.html or 404 (not 403).
    location / {
        try_files $uri $uri/index.html =404;
    }

    # HTML must not be cached aggressively so content updates are picked up.
    location ~* \.html$ {
        expires -1;
    }

    # Versioned assets (style.css?v=, main.js?v=) can be cached long-term.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://orbitnet-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        # Keep this above REQUEST_BUDGET_MS (22000) so the API can return a
        # normal JSON response instead of nginx cutting the connection.
        proxy_read_timeout 25s;
    }
}