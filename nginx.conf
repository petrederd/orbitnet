server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Derive the real client IP behind the CDN and reverse proxy.
    # Traffic path: Cloudflare (CDN) -> Caddy on the host -> this nginx.
    #
    # Caddy passes CF-Connecting-IP through unchanged, but by default it drops
    # the incoming X-Forwarded-For (to prevent spoofing), so XFF only ever
    # holds the CDN address here. We therefore read the client IP from
    # Cloudflare's authoritative CF-Connecting-IP header. It is honoured only
    # when the request arrives from a trusted address (the local Caddy, or
    # Cloudflare itself), so clients cannot spoof it via the origin directly.
    #
    # Cloudflare edge ranges — refresh from:
    #   https://www.cloudflare.com/ips-v4
    #   https://www.cloudflare.com/ips-v6
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Cloudflare IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Cloudflare IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # Basic security headers (applied to static responses and proxied ones)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://orbitnet-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 25s;
    }
}
